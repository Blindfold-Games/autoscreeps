version: 1
name: nexus-baseline
description: Nexus vs nexus baseline suite - validate opener speed and subsystem efficiency.
gates:
  primaryMetrics:
    - T_RCL3
    - nexusSpawnEfficiencyPct
    - nexusSourceCoveragePct
    - nexusCortexSkipRatePct
  training:
    minImprovedPrimaryMetrics: 2
  holdout:
    maxRegressionPct: 5
cases:
  - id: opener-train-1
    cohort: train
    scenario: ../scenarios/nexus-opener.yaml
  - id: opener-train-2
    cohort: train
    scenario: ../scenarios/nexus-opener.yaml
  - id: opener-train-3
    cohort: train
    scenario: ../scenarios/nexus-opener.yaml
  - id: opener-holdout-1
    cohort: holdout
    scenario: ../scenarios/nexus-opener.yaml
  - id: opener-holdout-2
    cohort: holdout
    scenario: ../scenarios/nexus-opener.yaml
