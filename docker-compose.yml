services:
  screeps:
    image: ghcr.io/jomik/screeps-server:edge
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "21025:21025"
      - "21026:21026"
    volumes:
      - ./config.yml:/screeps/config.yml:ro
      - ./dynamicMarketConfig.js:/screeps/dynamicMarketConfig.js:ro
      - ./strongholds.patch.js:/screeps/node_modules/@screeps/backend/lib/strongholds.js:ro
      - screeps-user:/home/node
      - screeps-data:/data
      - screeps-mods:/screeps/mods
    environment:
      MONGO_HOST: mongo
      REDIS_HOST: redis
      STEAM_KEY: ${STEAM_KEY:?Missing STEAM_KEY in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:21025', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  init:
    image: node:24-alpine
    depends_on:
      screeps:
        condition: service_healthy
    environment:
      SCREEPS_URL: http://screeps:21025
      SCREEPS_USERNAME: autoscreeps
      SCREEPS_PASSWORD: autoscreeps
    command:
      - node
      - -e
      - |
        const http = require('http');
        const net = require('net');
        const u = process.env.SCREEPS_USERNAME, p = process.env.SCREEPS_PASSWORD;
        function post(path, body) {
          return new Promise((resolve, reject) => {
            const data = JSON.stringify(body);
            const req = http.request(process.env.SCREEPS_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data) } }, res => {
              let buf = '';
              res.on('data', c => buf += c);
              res.on('end', () => resolve(JSON.parse(buf)));
            });
            req.on('error', reject);
            req.end(data);
          });
        }
        function cliSetPassword(username, password) {
          return new Promise((resolve, reject) => {
            const socket = net.createConnection({ host: 'screeps', port: 21026 });
            socket.setEncoding('utf8');
            let greeted = false;
            const timeout = setTimeout(() => { socket.destroy(); reject(new Error('CLI timeout')); }, 30000);
            socket.on('data', () => {
              if (!greeted) { greeted = true; socket.write('setPassword(' + JSON.stringify(username) + ', ' + JSON.stringify(password) + ')\n', 'utf8'); return; }
              clearTimeout(timeout); socket.end(); resolve();
            });
            socket.on('error', err => { clearTimeout(timeout); reject(err); });
          });
        }
        post('/api/register/submit', { username: u, email: '', password: p, modules: { main: '' } })
          .then(r => {
            if (r.ok) { console.log('Created user', u); return; }
            if (r.error && r.error.toLowerCase().includes('exists')) { console.log('User exists, resetting password via CLI'); return cliSetPassword(u, p).then(() => console.log('Password reset for', u)); }
            throw new Error('register failed: ' + JSON.stringify(r));
          })
          .catch(e => { console.error(e.message); process.exit(1); });
    restart: "no"

  client:
    image: node:24-alpine
    command:
      - npx
      - --yes
      - screepers-steamless-client
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --internal_backend
      - http://screeps:21025
      - --package
      - /steam/package.nw
    depends_on:
      screeps:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - npm-cache:/root/.npm
      - ${SCREEPS_PACKAGE_NW_PATH:?Missing SCREEPS_PACKAGE_NW_PATH in .env}:/steam/package.nw:ro
    restart: unless-stopped

  mongo:
    image: mongo:4.4.30
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  npm-cache:
  screeps-data:
  screeps-mods:
  screeps-user:
  mongo-data:
  redis-data:
